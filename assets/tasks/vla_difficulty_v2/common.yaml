version: 2
robot:
  model: g1_bench
  name: robot_0
  panorama:
    head_link: head_link
    mount_frame_link: torso_link
    offset:
    - 0
    - 0
    - 0.57
    face_size: 512
    width: 2048
    height: 1024
  obs_modalities:
  - rgb
  - depth_linear
  - seg_instance
  image_width: 640
  image_height: 480
  kinematics:
    urdf_path: build/robots/g1_bench/g1_bench_validated.urdf
    base_link: base_link
    end_effector_link: right_eef_link
    controlled_joints: auto
    joint_limits_source: urdf
    ik_seed: 0
  base_half_extent: 0.25
  include_sensor_names: null
feasibility:
  backend: pinocchio
  mode: endpoint
termination:
  max_planning_steps: 60
  fail_on_wrong_grasp: false
  fail_on_unsafe_action: false
  succeed_when_holding_target: false
skills:
- MOVE
- TURN
- VIEW
- OPEN
- CLOSE
- GRASP
- PLACE
- REPORT_DONE
