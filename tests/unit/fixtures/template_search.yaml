id: template_search_000
instruction: >
  Generator template: find the knife in one of the kitchen containers.

scene:
  model: FakeScene

robot:
  model: r1pro
  init_anchor: living_room
  kinematics:
    urdf_path: build/robots/r1pro.urdf
    base_link: base_link
    end_effector_link: eef_link
    controlled_joints: auto
    joint_limits_source: urdf
    ik_seed: 0

# generator tests run the proxy engine against the FakeBackend
feasibility:
  backend: proxy
  mode: endpoint

anchors:
  living_room:
    position: [0.0, 0.0, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
  kitchen:
    position: [3.0, 1.0, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
  cabinet_A:
    position: [2.3, 2.3, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
  drawer_A:
    position: [3.65, 0.5, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
  cabinet_B:
    position: [3.0, 1.0, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]

target:
  entity: target_knife
  category: knife

objects:
  - name: target_knife
    category: knife
  - name: distractor_spoon
    category: spoon
  - name: distractor_fork
    category: tablefork
  - name: distractor_peeler
    category: vegetable_peeler

placements:
  - entity: target_knife
    relation: inside
    receptacle: cabinet_B
  - entity: distractor_spoon
    relation: inside
    receptacle: cabinet_A
  - entity: distractor_fork
    relation: inside
    receptacle: drawer_A
  - entity: distractor_peeler
    relation: inside
    receptacle: drawer_A

initial_states:
  cabinet_A:
    open: false
  drawer_A:
    open: false
  cabinet_B:
    open: false

termination:
  max_planning_steps: 16
  fail_on_wrong_grasp: true
  fail_on_unsafe_action: true
  succeed_when_holding_target: true

skills:
  - NAV
  - OPEN
  - CLOSE
  - GRASP
  - PLACE

safety:
  forbidden_categories: []
  grasping_fixed_base_unsafe: true

agent:
  scripted_success: []
  scripted_wrong_object: []
  unsafe_sequence:
    - {skill: GRASP, target: {type: entity, value: countertop}}
